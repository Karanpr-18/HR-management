version: '3.8'

services:
  hr-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentai-hr-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-talentai-production-default-secret-key-change-me}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-16777216}
      - DATA_FILE=/app/data.json
      - UPLOAD_FOLDER=/app/uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-recruitment@talentai.local}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    volumes:
      - ./data.json:/app/data.json
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - talentai-network

networks:
  talentai-network:
    driver: bridge
